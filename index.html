<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Roles Ocupados | Rick Prime P-47</title>
  <style>
    :root {
      --bg-color: #050811;
      --card-bg: rgba(10, 20, 35, 0.75);
      --prime-green: #00ff66;
      --prime-glow: rgba(0, 255, 102, 0.4);
      --cyber-blue: #00e5ff;
      --warning-red: #ff0055;
      --text-main: #e0f2fe;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(0, 255, 102, 0.08) 0%, transparent 60%),
        linear-gradient(to bottom, rgba(5, 8, 17, 0.9), rgba(5, 8, 17, 0.98)),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 229, 255, 0.03) 3px, rgba(0, 229, 255, 0.03) 3px);
    }

    /* Fondo Holográfico Cuadriculado */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px),
        linear-gradient(180deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -1;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(0, 255, 102, 0.3);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 0 25px var(--prime-glow), inset 0 0 15px rgba(0, 229, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--prime-green);
      padding-bottom: 1.5rem;
      position: relative;
    }

    header::after {
      content: "AlyaThe56 // SYSTEM_LOG";
      position: absolute;
      bottom: -10px;
      right: 10px;
      background: var(--bg-color);
      padding: 0 8px;
      font-size: 0.7rem;
      color: var(--cyber-blue);
      letter-spacing: 2px;
    }

    h1 {
      font-size: 2rem;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--prime-green);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--cyber-blue);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    /* Pestaña Bloqueada (Overlay) */
    .block-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(5, 8, 17, 0.98);
      backdrop-filter: blur(12px);
      z-index: 999999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .block-card {
      max-width: 500px;
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--warning-red);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
    }

    .block-card h2 {
      color: var(--warning-red);
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      text-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
    }

    .block-card p {
      color: var(--text-main);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .copy-btn {
      background: transparent;
      color: var(--cyber-blue);
      border: 1px solid var(--cyber-blue);
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
    }

    .copy-btn:hover {
      background: var(--cyber-blue);
      color: var(--bg-color);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
    }
  </style>
</head>
<body>

  <!-- Pestaña Permanente -->
  <div class="block-overlay">
    <div class="block-card">
      <h2>Página Cerrada</h2>
      <p>Motivos: Michi ya no partisipa más</p>
      <button class="copy-btn" onclick="copyList()">Copiar última lista</button>
    </div>
  </div>

  <div class="container">
    <header>
      <h1>Lista de Roles Ocupados</h1>
      <div class="subtitle">Rick Prime P-47</div>
    </header>
    <div class="grid" id="roles-list">
      <!-- Contenido de la lista -->
    </div>
  </div>

  <script>
    function copyList() {
      const listContent = document.getElementById('roles-list').innerText;
      navigator.clipboard.writeText(listContent).then(() => {
        alert('Última lista copiada al portapapeles.');
      }).catch(() => {
        alert('Error al copiar la lista.');
      });
    }
  </script>
</body>
</html>
